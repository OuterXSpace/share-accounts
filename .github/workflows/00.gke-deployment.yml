name: Deploy to Azure

on:
  workflow_call:
    inputs:
      IMAGE_FE:
        required: true
        type: string
      IMAGE_NGINX:
        required: true
        type: string
      INGRESS_IP:
        required: true
        type: string
      PERSONAL_TOTO_CDN:
        required: true
        type: string
      COMMON_TOTO_CDN:
        required: true
        type: string
      PUBLIC_CDN:
        required: true
        type: string
      DOT_ENV_FILE_NAME:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      PASSWORD_DOCKER_HUB:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SERVER_IP:
        required: true
      SERVER_USER:
        required: true
      PORT:
        required: true
env:
  IMAGE_FE: ${{ inputs.IMAGE_FE }}
  IMAGE_NGINX: ${{ inputs.IMAGE_NGINX }}
  PERSONAL_TOTO_CDN: ${{ inputs.PERSONAL_TOTO_CDN }}
  COMMON_TOTO_CDN: ${{ inputs.COMMON_TOTO_CDN }}
  PUBLIC_CDN: ${{ inputs.PUBLIC_CDN }}
  INGRESS_IP: ${{ inputs.INGRESS_IP }}
  DOT_ENV_FILE_NAME: ${{ inputs.DOT_ENV_FILE_NAME }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  PASSWORD_DOCKER_HUB: ${{ secrets.PASSWORD_DOCKER_HUB }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  PORT: ${{ secrets.PORT }}
  GITHUB_SHA: ${{ github.sha }}

jobs:
  setup-build-publish-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Prepare dotenv
        run: rm -rf .env && mv $DOT_ENV_FILE_NAME .env

      - name: Install Yarn
        run: npm install -g yarn

      - name: Grant execute permission for nginx
        run: chmod +x ./deploy/*

      - name: Create nginx folder
        run: mkdir ./nginx && mkdir ./nginx/conf.d

      - name: Generate default nginx configuration file setting
        run: ./deploy/nginx.default.conf.sh "$INGRESS_IP" "$PERSONAL_TOTO_CDN" "$COMMON_TOTO_CDN" "$PUBLIC_CDN" > ./nginx/conf.d/default.conf

      - name: Generate nginx configuration file setting
        run: ./deploy/nginx.conf.sh > ./nginx/nginx.conf

      - name: Build Docker image
        run: docker-compose build

      - name: Log in to Docker Hub
        run: docker login -u" $DOCKER_HUB_USERNAME" -p "$PASSWORD_DOCKER_HUB"   

      - name: Deploy with Docker Compose
        run: docker compose push

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
            sudo docker pull $DOCKER_HUB_USERNAME/$IMAGE_FE:$GITHUB_SHA
            sudo docker pull $DOCKER_HUB_USERNAME/$IMAGE_NGINX:$GITHUB_SHA
            sudo docker stop $IMAGE_FE || true
            sudo docker stop $IMAGE_NGINX || true
            sudo docker rm $IMAGE_FE || true
            sudo docker rm $IMAGE_NGINX || true
            sudo docker run -d --name $IMAGE_FE $DOCKER_HUB_USERNAME/$IMAGE_FE:$GITHUB_SHA
            sudo docker run -d -p $PORT:80 --name $IMAGE_NGINX $DOCKER_HUB_USERNAME/$IMAGE_NGINX:$GITHUB_SHA
            # sudo docker image prune -f
          EOF
